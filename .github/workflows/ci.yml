name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Syntax sanity check via the TypeScript compiler API (no type checking:
      # the TanStack Router codegen file and error-component module are not
      # in the repo yet, so project-wide `tsc --noEmit` cannot pass).
      - run: npm run syntax
